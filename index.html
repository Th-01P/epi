<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EPI Control – Gerenciamento de EPIs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-tertiary">

  <header class="app-header text-bg-dark">
    <div class="container py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div>
        <span class="fs-4 fw-bold">EPI Control</span>
        <div class="small text-secondary">Empréstimo de equipamentos de proteção individual</div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <label for="me" class="small text-secondary mb-0">Usuário</label>
        <select id="me" class="form-select form-select-sm w-auto"></select>
      </div>
    </div>
    <div class="container">
      <ul class="nav nav-tabs border-0 flex-nowrap overflow-auto" id="nav"></ul>
    </div>
  </header>

  <main class="container py-4" id="main"></main>

  <!-- Modal de formulários -->
  <div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="modalTitle"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div id="modalBody"></div>
          <div class="text-danger small mt-3" id="err"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-warning" id="ok">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Aviso (toast) -->
  <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
    <div id="toast" class="toast text-bg-dark" role="status" aria-live="polite">
      <div class="toast-body" id="toastMsg"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
